name: owl-wms-multinode

resources:
  # The image_id will be automatically updated by the build_and_push.sh script
  image_id: anm5704/d-fusion:latest
  accelerators: H200:8
  cloud: kubernetes

num_nodes: 1

setup: |
  # Commands to run inside the container
  # The git commands below are not needed because your local code is already 
  # copied into the Docker image during the build process.
  # --------------------------------------------------------------------
  # cd /app
  # git remote remove origin
  # git remote add origin https://github.com/anm-ol/owl-wms.git
  # git fetch
  # git submodule sync --recursive
  # git submodule update --init --recursive
  # --------------------------------------------------------------------

  # Install/update dependencies if requirements.txt has changed
  pip install -r requirements.txt

  # Fix potential nccl errors in some environments
  apt-get update && apt-get install -y rdma-core libibverbs1 libibverbs-dev infiniband-diags
  apt-get install -y libgl1-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1

  # This torch upgrade might not be necessary if the base Docker image is correct, but is kept for safety
  # pip install --upgrade torch==2.8.0 torchvision torchaudio
  
file_mounts:
  /app/my.env: ./.env

run: |
  export LOGLEVEL=INFO
  cd /app
  set -a && source /app/my.env && set +a

  # Get the head node IP
  MASTER_ADDR=$(echo "$SKYPILOT_NODE_IPS" | head -n1)
  echo "Starting distributed training, head node: $MASTER_ADDR"

  export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

  # This script is not needed for training, it's for pre-processing.
  # If your data is already pre-processed and available at the path specified
  # in your config (e.g., preproccessing/cached_data_v3_ltx), you can comment this out.
  # bash scripts/data.sh
  
  # Run distributed training with torchrun
  torchrun \
    --nnodes=$SKYPILOT_NUM_NODES \
    --nproc_per_node=$SKYPILOT_NUM_GPUS_PER_NODE \
    --master_addr=$MASTER_ADDR \
    --node_rank=${SKYPILOT_NODE_RANK} \
    --master_port=8008 \
     train.py --config_path configs/tekken_finetune_state.yml --nccl_timeout 1000